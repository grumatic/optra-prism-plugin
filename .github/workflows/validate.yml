name: Validate Plugin

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.207

      - name: Validate plugin manifests
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Validate release metadata
        run: |
          node -e "
            const p = JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            const m = JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            if (!p.version) throw new Error('Missing version in plugin.json');
            if (!p.name) throw new Error('Missing name in plugin.json');
            if (p.version !== pkg.version) throw new Error('Version mismatch: plugin.json=' + p.version + ' package.json=' + pkg.version);
            const mp = m.plugins.find(x => x.name === p.name);
            if (!mp) throw new Error('Missing plugin entry in marketplace.json: ' + p.name);
            if (mp.version !== p.version) throw new Error('Version mismatch: marketplace.json=' + mp.version);
            if (mp.source !== './') throw new Error('Unexpected marketplace source: ' + mp.source);
            console.log('OK: ' + p.name + '@' + p.version);
          "

      - name: Syntax check JS
        run: |
          for f in lib/*.js hooks/scripts/*.js; do
            node --check "$f"
          done

      - name: Test
        run: npm test

      - name: Validate hooks.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf8'))"

      - name: Validate command frontmatter
        run: |
          for f in commands/*.md; do
            head -1 "$f" | grep -q '^---$' || (echo "Missing frontmatter in $f" && exit 1)
          done
